efiBootLoader: grub
grubInstall: grub-install
grubMkconfig: grub-mkconfig
grubCfg: /boot/grub/grub.cfg
grubProbe: grub-probe
efiBootMgr: efibootmgr
# Use the directory maintained by Ubuntu's signed GRUB and shim packages.
efiBootloaderId: ubuntu
# grub-install also provisions the signed fallback. Do not overwrite it with GRUB.
installEFIFallback: false
